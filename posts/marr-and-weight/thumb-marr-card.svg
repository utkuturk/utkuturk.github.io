<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Marr's get-out-of-jail-free card, voided, in front of jail bars" font-family="Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif">
<rect width="800" height="800" fill="#fff"/>
<rect x="64" y="40" width="22" height="720" rx="6" fill="#dedede"/>
<rect x="160" y="40" width="22" height="720" rx="6" fill="#dedede"/>
<rect x="256" y="40" width="22" height="720" rx="6" fill="#dedede"/>
<rect x="352" y="40" width="22" height="720" rx="6" fill="#dedede"/>
<rect x="448" y="40" width="22" height="720" rx="6" fill="#dedede"/>
<rect x="544" y="40" width="22" height="720" rx="6" fill="#dedede"/>
<rect x="640" y="40" width="22" height="720" rx="6" fill="#dedede"/>
<rect x="736" y="40" width="22" height="720" rx="6" fill="#dedede"/>
<rect x="40" y="40" width="720" height="22" rx="6" fill="#dedede"/>
<rect x="40" y="738" width="720" height="22" rx="6" fill="#dedede"/>
<rect x="114" y="179" width="600" height="470" rx="26" fill="#c8c8c8" transform="rotate(-5 400 400)"/>
<g transform="rotate(-5 400 400)"><rect x="100" y="165" width="600" height="470" rx="26" fill="#fff" stroke="#1a1a1a" stroke-width="12"/><rect x="120" y="185" width="560" height="430" rx="14" fill="none" stroke="#1a1a1a" stroke-width="3"/><text x="400" y="240" font-size="28" text-anchor="middle" fill="#1a1a1a" font-family="Georgia, Source Serif Pro, serif" letter-spacing="10">MARR · 1982</text><line x1="180" y1="264" x2="620" y2="264" stroke="#1a1a1a" stroke-width="3"/><text x="400" y="348" font-size="72" text-anchor="middle" fill="#1a1a1a" font-family="Georgia, Source Serif Pro, serif" font-weight="700">GET OUT OF</text><text x="400" y="428" font-size="72" text-anchor="middle" fill="#1a1a1a" font-family="Georgia, Source Serif Pro, serif" font-weight="700">JAIL FREE</text><text x="400" y="478" font-size="22" text-anchor="middle" fill="#1a1a1a" font-family="Georgia, Source Serif Pro, serif" font-weight="700" letter-spacing="6">USE WHEN</text><text x="400" y="513" font-size="26" text-anchor="middle" fill="#1a1a1a" font-family="Georgia, Source Serif Pro, serif" font-style="italic">you do not want to face</text><text x="400" y="546" font-size="26" text-anchor="middle" fill="#1a1a1a" font-family="Georgia, Source Serif Pro, serif" font-style="italic">the consequences of your assumptions.</text><text x="400" y="588" font-size="19" text-anchor="middle" fill="#9a9a9a" font-family="Georgia, Source Serif Pro, serif" >excuses the holder from the other two levels</text></g>
<g transform="rotate(-14 605 660)" opacity="0.92"><rect x="480" y="610" width="250" height="100" rx="10" fill="none" stroke="#c8312b" stroke-width="11"/><text x="605" y="689" font-size="80" font-weight="700" letter-spacing="8" text-anchor="middle" fill="#c8312b" font-family="Georgia, Source Serif Pro, serif">VOID</text></g>
</svg>

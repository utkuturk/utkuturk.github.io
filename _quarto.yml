project:
  type: website
  output-dir: _site
  render:
    - "**/*.qmd"
    - "**/*.ipynb"
    - "!posts/unergative-timing/"
  resources:
    - images/
    - files/
    - assets/js/

website:
  title: "utku turk"
  site-url: https://www.utkuturk.com
  search: false

  google-analytics: "G-V0SVR4S6DQ"
  comments:
    giscus:
      repo: utkuturk/utkuturk.github.io
      repo-id: "R_kgDOQCZuMw"
      category: "General"
      category-id: "DIC_kwDOQCZuM84CxOt1"
      mapping: title
      reactions-enabled: true
      loading: lazy
      input-position: top
      theme: noborder_light

  navbar:
    pinned: false
    right:
      - text: research
        href: research.qmd
      - text: papers
        href: papers.qmd
      - text: talks
        href: talks.qmd
      - text: teaching
        href: teaching.qmd
      - text: "{{< ai cv >}}"
        href: /files/cv.pdf
        target: "_blank"
      - text: "{{< ai google-scholar >}}"
        href: https://scholar.google.com/citations?hl=tr&user=wa7LG9gAAAAJ
        target: "_blank"
      - icon: github
        href: https://github.com/utkuturk
        target: "_blank"
      - icon: twitter
        href: https://twitter.com/UtkuTurkLing
        target: "_blank"
      - icon: bluesky
        href: https://bsky.app/profile/utkuturk.com
        target: "_blank"
format:
  html:
    grid:
      body-width: 800px # total page content width
      sidebar-width: 260px # left sidebar
      margin-width: 260px # right margin ("categories" column)
      gutter-width: 1.5rem # space between columns
    theme:
      light:
        - cosmo
        - brand
        - assets/css/theme.scss
      dark:
        - darkly
        - brand
        - assets/css/theme.scss
        - assets/css/darcula.scss
    css: assets/css/site.css
metadata-files:
  - fragments/align-bar.yml

